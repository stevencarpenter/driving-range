name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      docker_checks:
        description: Build isolated runtimes and execute integration/reference checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.8'
      - run: make check
      - run: sh -n scripts/release.sh

  docker:
    if: github.event_name == 'workflow_dispatch' && inputs.docker_checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.8'
      - run: make setup
      - run: make integration
      - run: make audit-solutions
      - run: make smoke
