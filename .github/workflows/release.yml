name: Release archives

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing draft release tag to verify, package, and publish
        required: true
        type: string

concurrency:
  group: release-archives-${{ inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.tag_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [base, vim, search, shell, awk, ancillary]
    steps:
      - name: Require dispatch at the selected tag
        run: test "$GITHUB_REF" = "refs/tags/$RELEASE_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.51.0'
      - name: Install native practice tools
        run: sudo apt-get update && sudo apt-get install -y neovim zsh
      - run: just setup
      - run: just integration "${{ matrix.shard }}"
      - run: just audit-solutions "${{ matrix.shard }}"
      - if: matrix.shard == 'base'
        run: just smoke

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.51.0'
      - run: just check
      - name: Crossbuild archives and checksums
        run: ./scripts/release.sh "$RELEASE_VERSION"
      - name: Attest archive provenance
        if: vars.GOLF_ATTEST_RELEASES == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/**/*.tar.gz
      - name: Upload archives and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_VERSION" "dist/$RELEASE_VERSION/"*.tar.gz "dist/$RELEASE_VERSION/SHA256SUMS"
          gh release edit "$RELEASE_VERSION" --draft=false
