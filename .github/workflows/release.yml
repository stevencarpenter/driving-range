name: Release archives

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [base, vim, search, shell, awk, ancillary]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.51.0'
      - name: Install native practice tools
        run: sudo apt-get update && sudo apt-get install -y neovim zsh
      - run: just setup
      - run: just integration "${{ matrix.shard }}"
      - run: just audit-solutions "${{ matrix.shard }}"
      - if: matrix.shard == 'base'
        run: just smoke

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.51.0'
      - run: just check
      - name: Crossbuild archives and checksums
        run: ./scripts/release.sh "$RELEASE_VERSION"
      - name: Attest archive provenance
        if: vars.GOLF_ATTEST_RELEASES == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/**/*.tar.gz
      - name: Attach archives to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_VERSION" "dist/$RELEASE_VERSION/"*.tar.gz "dist/$RELEASE_VERSION/SHA256SUMS"
